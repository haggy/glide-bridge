[project]
name = "local-glide-bridge"
version = "0.1.0"
description = "Stream Glide robot telemetry from ROS 2 (via rosbridge) to local Python tools"
requires-python = ">=3.10,<3.14"
dependencies = [
    "roslibpy>=1.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "mcap>=1.6.0",
    "mcap-ros2-support>=0.6.0",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
    "ipython>=8.39.0",
    "pytest>=8",
]
# Model code (src/). Keep torch, torchvision and ultralytics on the same versions as the
# glide_ros conda env (env/ros_humble.yml). PyPI's Linux torch is the CUDA build. Skipped
# on Intel Macs and Python 3.10, which have no wheels for current PyTorch.
model = [
    "torch==2.15.*; python_version >= '3.11' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "torchvision==0.29.*; python_version >= '3.11' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "ultralytics==8.4.213; python_version >= '3.11' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "opencv-python>=4.10,<5; python_version >= '3.11' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]

[tool.setuptools]
packages = ["glide_bridge"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
default-groups = ["dev", "model"]   # plain `uv sync` installs both
# roslibpy -> autobahn -> cbor2/cryptography. Their newest releases ship no
# Intel-Mac (x86_64) wheels and need a Rust toolchain to build, so cap them at
# the last versions with wheels, and never build them from source.
constraint-dependencies = ["autobahn<=24.4.2", "cbor2<=5.9.0", "cryptography<=48.0.1"]
no-build-package = ["cbor2", "cryptography", "autobahn"]
